name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  commits:
    name: Commit subjects
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Every new commit follows the convention the release reads
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ${EVENT} == pull_request ]]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [[ -z ${BEFORE} || ${BEFORE} == 0000000000000000000000000000000000000000 ]]; then
            range="${AFTER}"
          elif git merge-base --is-ancestor "${BEFORE}" "${AFTER}" 2>/dev/null; then
            range="${BEFORE}..${AFTER}"
          else
            range="${AFTER}~1..${AFTER}"
          fi
          bash scripts/check-commits.sh --range "${range}"

  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked --python "${PYTHON_VERSION}"

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Lint the workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Lint the shell scripts and hooks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint
          shellcheck --severity=style --shell=bash scripts/*.sh .githooks/*
          yamllint -c .yamllint.yml .github

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Every JSON and YAML file is formatted
        run: pnpm run format:check

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked --python "${PYTHON_VERSION}"

      - name: Every annotation has to hold
        run: uv run mypy

  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, label: Linux x86_64 }
          - { os: ubuntu-24.04-arm, label: Linux arm64 }
          - { os: macos-15-intel, label: macOS Intel }
          - { os: macos-26, label: macOS Apple silicon }
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked --python "${PYTHON_VERSION}"

      - name: The suite, against nothing but the repository
        run: uv run pytest -q -p no:randomly

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked --python "${PYTHON_VERSION}"

      - name: Coverage clears the gate in pyproject.toml
        run: uv run pytest -q -p no:randomly --cov --cov-report=term-missing

  library:
    name: The library installs without the cli extra
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the package alone, as the formula does but without the extra
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/bare
        run: uv sync --locked --no-dev --no-editable --python "${PYTHON_VERSION}"

      - name: The library imports and runs, and the command says how to get the cli extra
        env:
          BARE: ${{ runner.temp }}/bare
        run: |
          set -euo pipefail
          "${BARE}/bin/python" -c "from henkan import doctor; assert doctor.diagnose().healthy"
          if "${BARE}/bin/python" -c "import typer" 2>/dev/null; then
            echo "::error title=Typer leaked::the library install pulled in typer"
            exit 1
          fi
          set +e
          message=$("${BARE}/bin/henkan" doctor 2>&1)
          code=$?
          set -e
          echo "${message}"
          if [[ ${code} != 1 || ${message} != *"cli extra"* ]]; then
            echo "::error title=No hint::without the extra the command must exit 1 and name the extra"
            exit 1
          fi

  installed:
    name: Installed on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, label: Linux x86_64 }
          - { os: ubuntu-24.04-arm, label: Linux arm64 }
          - { os: macos-15-intel, label: macOS Intel }
          - { os: macos-26, label: macOS Apple silicon }
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install it the way the formula does, with the command line
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/installed
        run: uv sync --locked --no-dev --no-editable --extra cli --python "${PYTHON_VERSION}"

      - name: The command line runs and the installation is healthy
        env:
          HENKAN: ${{ runner.temp }}/installed/bin/henkan
        run: |
          "${HENKAN}" --version
          "${HENKAN}" doctor
          "${HENKAN}" doctor --json

  distribution:
    name: The wheel carries the library and nothing else
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build it
        run: uv build --wheel

      - name: No test or test support file ships
        run: |
          python3 - <<'CHECK'
          import sys
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          shipped = [name for name in names if name.endswith(("_test.py", "_test_support.py", "conftest.py"))]
          print(f"{len(names)} files in {wheel.name}")
          if shipped:
              print(f"::error title=Tests in the wheel::{', '.join(shipped)}")
              sys.exit(1)
          CHECK
